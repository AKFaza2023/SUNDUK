name: Build SUNDUK Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: WPF / Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\src\Sunduk.Desktop\Sunduk.Desktop.csproj -r win-x64

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish .\src\Sunduk.Desktop\Sunduk.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish\win-x64

      - name: Verify SUNDUK.exe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\win-x64\SUNDUK.exe'
          if (-not (Test-Path $exe)) { throw 'SUNDUK.exe was not produced.' }
          $file = Get-Item $exe
          if ($file.Length -lt 1000000) { throw "SUNDUK.exe looks unexpectedly small: $($file.Length) bytes" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "SUNDUK.exe size: $($file.Length) bytes"
          Write-Host "SHA256: $hash"
          "SHA256  $hash  SUNDUK.exe" | Set-Content -Encoding ascii .\publish\win-x64\SHA256.txt

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path .\publish\win-x64\* -DestinationPath .\SUNDUK_0.3_win-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUNDUK-0.3-win-x64
          path: |
            publish/win-x64/SUNDUK.exe
            publish/win-x64/SHA256.txt
            SUNDUK_0.3_win-x64.zip
          if-no-files-found: error
          retention-days: 30
